# 목록 페이지 문구 — 설교 · 찬양 · 소식 · 주보 · 갤러리 목록 맨 위 머리글과 검색 · 공유 설명.
#   - title:       브라우저 탭 · 검색 결과의 페이지 제목. 교회 이름(「 | 청파중앙교회」)은 자동으로 붙으니 적지 않는다.
#   - heading:     머리글의 큰 제목 (비우면 title과 같다)
#   - label:       머리글 위의 작은 분류 글자
#   - intro:       머리글 제목 아래 한두 줄 소개
#   - description: 검색 결과 · 카카오톡 공유 미리보기에 나오는 설명
#   - 문구에 {{name}}(교회 이름) 같은 자리표시를 쓸 수 있다. 다른 pages/*.yaml과 같은 목록 — content/README.md 「자리표시」 절.
#   - 모든 값은 비워 둘 수 없다(heading 제외). 고친 뒤 `npm run build`가 통과해야 한다.

sermons:
  label: 말씀
  title: 설교
  intro: "주일예배를 비롯한 {{name}}의 말씀을 다시 만나 보세요."
  description: "{{name}} 설교 말씀 아카이브입니다. 예배 종류, 시리즈, 설교자별로 찾아 유튜브로 시청하세요."

praise:
  label: 말씀
  title: 찬양
  intro: 예배 가운데 드린 찬양 영상입니다.
  description: "{{name}} 찬양대와 찬양팀의 찬양 영상을 모았습니다."

news:
  label: 소식
  title: 소식
  heading: 교회 소식
  intro: 공지사항, 행사 안내, 간증을 전합니다.
  description: "{{name}} 공지사항, 교회 소식, 간증을 확인하세요."

bulletin:
  label: 소식
  title: 주보
  intro: 매주 주보를 PDF로 내려받거나 바로 볼 수 있습니다.
  description: "{{name}} 주보 아카이브입니다. 매주 주보를 PDF로 보실 수 있습니다."

gallery:
  label: 소식
  title: 갤러리
  intro: 함께한 순간들을 사진으로 남깁니다.
  description: "{{name}}의 예배와 행사, 수련회 사진을 모았습니다."
