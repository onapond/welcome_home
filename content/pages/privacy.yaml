# 개인정보 처리방침(/privacy) 문구 — 바닥글의 「개인정보 처리방침」 링크와 방문 신청 · 문의 양식의 동의 문구가 이 파일을 읽는다.
#   - sections는 위에서부터 차례로 「제1조 …」처럼 번호가 붙는다. 조항마다 paragraphs(문단)나 items(목록) 중 하나 이상을 쓴다.
#   - {{name}} {{phone}} 같은 자리표시는 site.yaml 값으로 바뀐다(content/README.md 「자리표시」).
#   - 양식에서 받는 항목을 바꾸면(예: 이메일 칸 추가) 제1조 · 동의 문구도 함께 고친다.
#
# TODO(교회 확인): 이 문서는 홈페이지 양식이 실제로 받는 항목과 쓰는 업체(Resend · Vercel)를 바탕으로 쓴 초안이다.
#   ① 보유 기간(「30일 이내」), ② 개인정보 보호책임자의 성명 · 직위, ③ 시행일을 교회가 정해 바로잡는다.
#   ④ 국외 이전 조항(업체 서버 위치)은 게시 전에 업체 약관과 대조한다.

meta:
  title: 개인정보 처리방침
  description: "{{name}} 홈페이지의 개인정보 처리방침입니다. 방문 신청 · 문의 양식에서 받는 정보와 이용 목적, 보유 기간을 안내합니다."

title: 개인정보 처리방침
intro: >-
  {{name}}(이하 「교회」)는 홈페이지의 방문 신청과 문의 양식으로 받은 개인정보를
  「개인정보 보호법」에 따라 안전하게 처리하며, 그 기준을 다음과 같이 알려 드립니다.

sections:
  - title: 수집하는 개인정보 항목
    items:
      - "방문 신청: 이름, 연락처, 방문 희망일, 참석할 예배, 인원, 남기실 말씀(선택)"
      - "문의: 이름, 연락처, 문의 유형, 문의 내용"
      - "홈페이지 이용 과정에서 접속 IP 주소 등 접속 기록이 자동으로 생성될 수 있습니다."

  - title: 개인정보의 수집 · 이용 목적
    items:
      - 방문 신청자에게 방문 안내 연락
      - 문의에 대한 답변
      - 같은 곳에서 짧은 시간에 반복되는 신청(스팸) 차단
    paragraphs:
      - 위 목적 밖으로는 이용하지 않으며, 목적이 바뀌면 미리 동의를 받습니다.

  - title: 보유 및 이용 기간
    paragraphs:
      # TODO(교회 확인): 보유 기간 「30일 이내」는 임시 값이다. 바꾸면 아래 consent 문구도 함께 고친다.
      - 방문 신청 정보는 방문 안내를 마친 뒤 30일 이내에, 문의 정보는 답변을 마친 뒤 30일 이내에 파기합니다.
      - 홈페이지는 신청 · 문의 내용을 따로 저장하지 않고 교회 담당자의 이메일로 전달합니다. 스팸 차단에 쓰는 접속 IP 주소는 서버 메모리에서 10분 동안만 쓰이며 따로 저장하지 않습니다.

  - title: 개인정보의 파기 절차 및 방법
    paragraphs:
      - 보유 기간이 끝난 개인정보는 지체 없이 파기합니다. 이메일 등 전자 파일은 복구할 수 없는 방법으로 지우고, 종이에 옮겨 적은 기록은 분쇄하거나 소각합니다.

  - title: 개인정보의 제3자 제공
    paragraphs:
      - 교회는 개인정보를 제3자에게 제공하지 않습니다. 다만 법령에 특별한 규정이 있는 경우는 예외로 합니다.

  - title: 개인정보 처리의 위탁
    paragraphs:
      - 교회는 홈페이지 운영을 위해 다음 업무를 맡기고 있습니다.
    items:
      - "Resend, Inc.: 방문 신청 · 문의 내용을 교회 담당자 이메일로 전달(이메일 발송)"
      - "Vercel Inc.: 홈페이지 운영(호스팅)"

  # TODO(교회 확인): 국외 이전 — 두 업체의 서버 위치와 보관 기간을 업체 약관과 대조한다.
  - title: 개인정보의 국외 이전
    paragraphs:
      - 위 업체의 서버가 국외(미국 등)에 있어, 양식을 보낼 때 입력한 정보가 네트워크를 통해 국외로 전송될 수 있습니다. 전송된 정보는 이메일 전달과 홈페이지 운영에만 쓰입니다.
      - 국외 이전을 원하지 않으시면 양식 대신 전화({{phone}})로 신청하거나 문의하실 수 있습니다.

  - title: 정보주체의 권리와 행사 방법
    paragraphs:
      - 개인정보의 열람, 정정 · 삭제, 처리 정지를 언제든지 요구하실 수 있습니다. 교회 사무실({{phone}})로 연락 주시면 지체 없이 처리합니다.

  # TODO(교회 확인): 개인정보 보호책임자의 성명 · 직위를 적는다(지금은 사무실만 적어 두었다).
  - title: 개인정보 보호책임자
    items:
      - "담당: {{name}} 교회 사무실"
      - "전화: {{phone}}"

  - title: 권익 침해 구제 방법
    paragraphs:
      - 개인정보 침해에 대한 신고나 상담이 필요하시면 아래 기관에 문의하실 수 있습니다.
    items:
      - "개인정보침해신고센터: 국번 없이 118 (privacy.kisa.or.kr)"
      - "개인정보분쟁조정위원회: 1833-6972 (www.kopico.go.kr)"

  - title: 처리방침의 변경
    paragraphs:
      - 이 처리방침을 바꾸면 시행 7일 전부터 홈페이지에 알립니다.

# TODO(교회 확인): 시행일 — 교회가 이 문서를 확정한 날로 바꾼다.
effectiveDate: 2026-11-27

# 양식 아래 동의 문구. 보유 기간을 바꾸면 여기도 고친다.
consent:
  # TODO(교회 확인): 「30일 이내」 — 위 보유 기간과 같게 맞춘다.
  visit: >-
    방문 안내 연락을 위해 이름 · 연락처 · 방문 희망일을 수집 · 이용하는 데 동의합니다.
    수집한 정보는 방문 안내를 마친 뒤 30일 이내에 파기합니다.
    동의하지 않으실 수 있으나, 동의하지 않으면 온라인 방문 신청을 접수할 수 없습니다(전화 {{phone}}로 신청하실 수 있습니다).
  contact: >-
    문의 답변을 위해 이름 · 연락처 · 문의 내용을 수집 · 이용하는 데 동의합니다.
    수집한 정보는 답변을 마친 뒤 30일 이내에 파기합니다.
    동의하지 않으실 수 있으나, 동의하지 않으면 온라인 문의를 접수할 수 없습니다(전화 {{phone}}로 문의하실 수 있습니다).
  linkLabel: 개인정보 처리방침 보기
