# 오시는 길 — 홈 · 새가족 · 예배 안내 페이지 아래에 공통으로 나오는 「오시는 길」 섹션.
#   주소 · 전화 · 팩스 · 지도 검색어는 site.yaml에서 가져온다. 여기에는 지도 버튼 · 길찾기 안내 · 교통편 문구를 둔다.
