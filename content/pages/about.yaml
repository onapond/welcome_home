# 교회소개(/about) 문구 — 소개 머리글 · 비전 · 담임목사 소개 · 신앙고백 · 각 섹션 제목.
#   - 연혁은 content/history.yaml, 교역자 명단은 content/staff.yaml, 담임목사 이름은 site.yaml(pastor)에서 읽는다.
#   - 문구 안의 {{founded}} {{denomination}} {{phone}} 같은 표시는 site.yaml의 값으로 바뀐다.
#   - meta는 검색 결과 · 공유 미리보기에 보이는 제목과 설명이다.
#   - icon 값은 정해진 이름만(목록은 home.yaml 위쪽 설명 참고).
#
# 비전(intro · items)은 옛 사이트 「소개 및 비전」 그림의 글을 옮겼다(2차 이전 m5, 11/28 · 「댄한신학교」 오타만 고침).
# TODO(이전): 목사 소개 · 약력 · 신앙고백은 교회 입력 없이 쓴 임시 문구다(옛 사이트에 해당 쪽이 없음).
#   교회 확인 뒤 교체한다.

meta:
  title: 교회소개
  description: "{{founded}}년 서울 용산구에서 설립된 {{name}}를 소개합니다. 담임목사 소개, 교회 역사, 비전, 신앙고백을 확인하세요."
  ogDescription: "{{founded}}년 설립의 {{name}}. {{vision}} {{denomination}} 교회입니다."

hero:
  badge: 교회소개
  title: "{{name}}를 소개합니다"
  lines:
    - "{{founded}}년 서울 용산에서 시작된"
    - "{{denomination}} 교회입니다."

vision:
  label: 비전 & 미션
  title: "{{vision}}"
  # 빈 줄로 문단을 나눈다.
  intro: |-
    청파중앙교회는 대한예수장로회(대신)의 모체 교회입니다.

    우리 교회의 초대 담임목사셨던 故고봉 김치선 박사는 한국 교계 최초의 신학 박사로서 미국 달라스 신학에서 수학하셨고 해방 후 귀국하여 (구) 대한신학교를 설립하셨습니다.

    남산동에 있던 대한신학교의 화재로 학교가 이 곳 청파중앙교회로 옮겨 왔고, 대한 신학은 이후 계속 성장하여 종합대학인 현재의 안양소재 안양대학교가 된 것입니다.

    교회의 당회장과 신학교 교장을 겸한 김치선 목사는 교회와 신학교를 구분하지 않고 목회와 신학생 교육에 헌신 노력하다가 1968년 2월 24일 70세의 일기로 소천하였습니다.

    현재 5대 담임 목사이신 김항우 목사님께서 2006년에 부임하셔서 "21세기 지도자를 길러내는 교회"의 비전을 가지고 목회하고 있습니다.
  items:
    - icon: target
      title: 21세기 지도자를 길러내는 교회
      text: 시대에 선한 영향력을 끼치며 민족과 교회를 섬길 지도자를 길러낸다.
    - icon: book-open
      title: 장학재단설립, 리더십훈련학교, 방과 후 학교 개설
      text: 인재들에게 구체적인 비전을 심어주고 실재적인 도움을 준다.

pastor:
  label: 담임목사
  roleLine: 담임목사 · 당회장
  photo: /images/site/pastor.webp   # 옛 사이트 「섬기는 분」 사진(185×219, 작음 — 큰 사진을 받으면 교체)
  bioLabel: 목사 소개
  bio: >-
    {{pastor}}님은 하나님의 말씀으로 성도들을 세우고,
    공동체가 함께 그리스도의 형상을 닮아가도록 이끄시는 담임목사님입니다.
    “{{vision}}”라는 비전 아래 청파중앙교회를 섬기고 계십니다.
  career:
    - { label: 학력, value: 신학대학원 졸업 (M.Div.) }
    - { label: 약력, value: 청파중앙교회 담임목사 }
    - { label: 교단, value: "{{denomination}}" }
    - { label: 연락처, value: "{{phone}}" }
  quote:
    text: 일어나 함께가자 — 우리는 혼자가 아닙니다. 하나님이 부르신 길 위에서 함께 걸어가는 공동체가 청파중앙교회입니다.
    by: "{{pastor}}"

history:
  label: 교회 역사
  title: "{{founded}}년부터 지금까지"
  allLabel: 연혁 전체

beliefs:
  label: 신앙고백
  title: 우리가 믿는 것
  intro: >-
    청파중앙교회는 대한예수교 장로회 신앙고백을 따르며
    성경의 권위 위에 세워진 교회입니다.
  items:
    - title: 성경
      text: 신구약 66권 성경은 하나님의 말씀으로서 신앙과 행위의 유일한 표준입니다.
    - title: 삼위일체 하나님
      text: 하나님은 성부·성자·성령 삼위일체이시며, 영원하시고 전능하신 창조주이십니다.
    - title: 예수 그리스도
      text: 예수 그리스도는 하나님의 독생자이시며, 동정녀에게서 나시고 죽으시고 부활하셔서 우리의 구원자가 되셨습니다.
    - title: 성령
      text: 성령은 신자 안에 내주하시며 성화의 사역을 이루시고 교회를 세우시는 하나님이십니다.
    - title: 구원
      text: 구원은 오직 믿음으로 말미암아 은혜로 받는 것이며, 행위로 얻을 수 없습니다 (엡 2:8-9).
    - title: 교회와 성례
      text: 교회는 그리스도의 몸이며, 세례와 성찬은 그리스도께서 제정하신 두 가지 성례입니다.

staff:
  label: 교역자
  title: 교역자 소개
