# 새가족 안내(/visit) 문구 — 머리글 · 자주 묻는 질문 · 예배 안내 제목 · 방문 신청 안내.
#   - 예배 카드와 신청 폼의 예배 선택지는 site.yaml의 예배 목록에서 자동으로 만들어진다.
#   - 질문 답변 안에 {{service.sunday.time}}, {{phone}}, {{transport.subway}}처럼 적으면
#     site.yaml · location.yaml의 값으로 바뀐다(예배 시간이 바뀌어도 여기를 고치지 않아도 된다).
#   - 질문을 더하려면 faq.items에 question / answer 한 쌍을 추가한다.
#
# TODO(이전): 옛 사이트 확인 전 — 아래 문구는 모두 교회 입력 없이 쓴 임시 문구다.
#   특히 주차 지원 · 점심 식사 · 연령별 예배 · 복장 · 헌금 안내를 교회에 확인한다.

meta:
  title: 새가족 안내
  description: "{{name}}에 처음 오시는 분을 환영합니다. 예배 시간, 오시는 길, 자녀 프로그램 등 방문 전 알아두실 내용을 안내합니다."
  ogDescription: "{{name}}에 처음 오시는 분을 환영합니다. 예배 시간, 오시는 길, FAQ를 확인하세요."

hero:
  badge: 새가족 안내
  title: 처음 오시는 분을 환영합니다
  lines:
    - 교회가 처음이셔도, 신앙이 없으셔도 괜찮습니다.
    - "{{name}}는 모든 분을 온 마음으로 환영합니다."

faq:
  label: 자주 묻는 질문
  title: 방문 전 알아두세요
  items:
    - question: 복장은 어떻게 입고 오면 되나요?
      answer: 특별한 복장 규정은 없습니다. 편안한 일상복으로 오셔도 전혀 문제없습니다. 중요한 것은 마음으로 드리는 예배입니다.
    - question: 주차는 가능한가요?
      answer: >-
        교회 전용 주차장은 없으나, 인근 공영주차장을 이용하실 수 있습니다.
        주일예배 시 2시간 주차비를 교회에서 지원해드립니다.
        대중교통 이용을 권장합니다 ({{transport.subway}}).
    - question: 예배는 몇 시에 시작하나요?
      answer: >-
        주일예배는 {{service.sunday.time}}에 시작합니다. 10~15분 전에 도착하시면 자리 안내를 받으실 수 있습니다.
        수요예배는 {{service.wednesday.time}}, 금요기도회는 {{service.friday.time}},
        새벽기도는 {{service.dawn.time}}입니다.
    - question: 아이와 함께 와도 되나요?
      answer: >-
        물론입니다! 영아부터 청소년까지 연령별로 분리된 예배와 교육 프로그램이 준비되어 있습니다.
        본당 입구에서 안내 받으시면 각 연령부로 안내해 드립니다.
    - question: 헌금은 꼭 해야 하나요?
      answer: >-
        처음 오시는 분께는 헌금에 대한 부담이 전혀 없습니다.
        헌금은 믿음으로 자발적으로 드리는 것입니다. 편하게 예배에만 집중하세요.
    - question: 예배 후 식사나 교제가 있나요?
      answer: >-
        주일예배 후 교회 식당에서 점심 식사를 함께 합니다.
        처음 오시는 분들도 함께 식사하시며 교우들과 자연스럽게 교제하실 수 있습니다. 별도 비용은 없습니다.

# 「처음 오시면 이렇게 진행돼요」 단계 안내 — items 순서대로 번호가 붙는다. steps를 지우면 섹션이 사라진다.
#   icon: door-open users baby book-open utensils hand-heart map-pin clock 등 (home.yaml 위쪽 목록 + door-open · hand-heart · utensils)
# TODO(교회 확인): 아래 단계는 site.yaml 예배 안내 문구(15분 전 도착 · 입구에서 연령부 안내 · 예배 후 점심)를
#   바탕으로 쓴 임시 문구다. 안내 위원 · 새가족 등록 절차 · 식사 여부를 교회에 확인한다.
steps:
  label: 첫 방문
  title: 처음 오시면 이렇게 진행돼요
  items:
    - icon: door-open
      title: 도착
      text: "예배 10~15분 전에 오시면 여유 있게 자리를 안내받으실 수 있습니다. 주일예배는 {{service.sunday.place}}에서 드립니다."
    - icon: users
      title: 안내
      text: 입구에서 안내하는 교우에게 처음 오셨다고 말씀해 주세요. 자리와 순서를 도와드립니다.
    - icon: baby
      title: 아이 맡기기
      text: 자녀와 함께 오셨다면 본당 입구에서 연령별 예배 장소로 안내해 드립니다.
    - icon: book-open
      title: 예배
      text: "{{service.sunday.time}} 주일예배를 함께 드립니다. 순서를 몰라도 편하게 앉아 계시면 됩니다."
    - icon: utensils
      title: 식사와 교제
      text: 예배 후 교회 식당에서 점심을 함께하며 교우들과 인사를 나눕니다.

services:
  label: 예배
  title: 예배 안내

reservation:
  label: 방문 예약
  title: 방문 신청하기
  intro: 방문 전 미리 신청해주시면 담당 사역자가 편안하게 안내해 드립니다.
  successMessage: 방문 신청이 접수되었습니다. 담당 사역자가 연락드리겠습니다.
  submitLabel: 방문 신청하기
